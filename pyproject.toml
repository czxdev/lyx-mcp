[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lyx-mcp-server"
version = "0.1.0"
description = "An isolated, transactional LyX MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
lyx-mcp = "lyx_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
