[lyx]
binary = "/usr/bin/lyx"
runtime_root = "/tmp"
startup_timeout_sec = 45
command_timeout_sec = 30
export_timeout_sec = 180
# profile_seed_dir = "/absolute/path/to/a/dedicated/lyx/userdir-template"

[security]
allowed_roots = ["/absolute/path/to/papers"]

